<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div id="app-container">
        <!-- Sidebar for browsing pages -->
        <aside id="sidebar">
            <div id="sidebar-resizer"></div>
            <div class="sidebar-header">
                <h2>Pages</h2>
                <div class="mode-toggle">
                    <label>
                        <input type="radio" name="mode" value="notes" checked> Notes
                    </label>
                    <label>
                        <input type="radio" name="mode" value="art"> Art
                    </label>
                </div>
                <div class="sidebar-actions">
                    <button id="new-folder-btn" class="secondary-btn">+ Folder</button>
                    <button id="new-page-btn" class="primary-btn">+ New Page</button>
                </div>
            </div>
            <div id="page-list" class="page-list">
                <!-- Page thumbnails populated here -->
            </div>
        </aside>

        <!-- Main content area -->
        <main id="main-content">
            <!-- Toolbar for drawing tools -->
            <header id="toolbar">
                <div class="tool-group">
                    <button class="tool-btn active" data-tool="pen" title="Pen">Pen</button>
                    <button class="tool-btn" data-tool="eraser" title="Eraser">Eraser</button>
                </div>

                <div class="tool-group">
                    <input type="color" id="color-picker" value="#ffffff" title="Color">
                    <input type="range" id="width-picker" min="1" max="20" value="3" title="Stroke Width">
                </div>

                <div class="tool-group">
                    <button id="undo-btn" class="icon-btn" title="Undo">Undo</button>
                    <button id="redo-btn" class="icon-btn" title="Redo">Redo</button>
                    <button id="fit-content-btn" class="icon-btn" title="Fit content to view">Fit</button>
                </div>

                <div class="spacer"></div>

                <div class="tool-group">
                    <span id="save-status">Saved</span>
                </div>
            </header>

            <!-- Canvas container -->
            <div id="canvas-container">
                <canvas id="drawing-canvas"></canvas>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="InputSource.js"></script>
    <script src="Canvas.js"></script>
    <script src="App.js"></script>
    <script src="index.js"></script>
</body>

</html>
