<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div id="app-container">
        <!-- Sidebar for browsing pages -->
        <aside id="sidebar">
            <div id="sidebar-resizer"></div>
            <div class="sidebar-header">
                <h2>Pages</h2>
                <div class="mode-toggle">
                    <label>
                        <input type="radio" name="mode" value="notes" checked> Notes
                    </label>
                    <label>
                        <input type="radio" name="mode" value="art"> Art
                    </label>
                </div>
                <div class="sidebar-actions">
                    <button id="new-folder-btn" class="secondary-btn">+ Folder</button>
                    <button id="new-page-btn" class="primary-btn">+ New Page</button>
                </div>
            </div>
            <div id="page-list" class="page-list">
                <!-- Page thumbnails populated here -->
            </div>
        </aside>

        <!-- Main content area -->
        <main id="main-content">
            <!-- Toolbar for drawing tools -->
            <header id="toolbar">
                <div class="tool-group">
                    <button class="tool-btn active" data-tool="pen" title="Pen (draw)">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/></svg>
                    </button>
                    <button class="tool-btn" data-tool="eraser" title="Eraser">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 20H7L3 16l10-10 7 7-4 4"/><path d="M6.5 17.5L13 11"/></svg>
                    </button>
                </div>

                <div class="tool-group">
                    <input type="color" id="color-picker" value="#ffffff" title="Color">
                    <input type="range" id="width-picker" min="1" max="20" value="3" title="Stroke Width">
                </div>

                <div class="tool-group">
                    <button id="undo-btn" class="icon-btn" title="Undo">&#8630;</button>
                    <button id="redo-btn" class="icon-btn" title="Redo">&#8631;</button>
                    <button id="fit-content-btn" class="icon-btn" title="Fit content to view">&#9723;</button>
                </div>

                <div class="spacer"></div>

                <div class="tool-group">
                    <span id="save-status">Saved</span>
                </div>
            </header>

            <!-- Canvas container -->
            <div id="canvas-container">
                <canvas id="drawing-canvas"></canvas>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="InputSource.js"></script>
    <script src="Canvas.js"></script>
    <script src="App.js"></script>
    <script src="index.js"></script>
</body>

</html>
