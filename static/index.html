<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>my little agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&family=Inter:wght@300;400;500&family=Nunito:wght@300;400;500&family=Outfit:wght@300;400;500&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap">
  <link rel="stylesheet" href="/static/css/variables.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/sidebar.css">
  <link rel="stylesheet" href="/static/css/chat.css">
  <link rel="stylesheet" href="/static/css/input.css">
  <link rel="stylesheet" href="/static/css/toast.css">
  <link rel="stylesheet" href="/static/css/memory.css">
  <link rel="stylesheet" href="/static/css/edit.css">
  <link rel="stylesheet" href="/static/css/mobile.css">
</head>

<body>
  <div id="sidebar-overlay" class="sidebar-overlay"></div>

  <aside>
    <div class="logo">yay yippie learning<br><span>// funny bunny</span></div>

    <div class="conversations-section">
      <div class="section-label">Conversations</div>
      <button id="new-chat-btn" class="btn btn-new-chat">+ New Chat</button>
      <div id="conversation-list" class="conversation-list">
        <!-- Rendered conversations go here -->
      </div>
    </div>

    <!-- Main Groq Toggle (Quick Access) -->
    <div class="main-toggle-row">
      <label class="toggle-row-label">use groq</label>
      <label class="toggle">
        <input id="cfg-use-groq" type="checkbox">
        <span class="toggle-slider"></span>
      </label>
    </div>

    <button class="btn btn-apply">apply config</button>

    <!-- Collapsible Settings Section -->
    <div class="settings-accordion">
      <button class="settings-toggle-btn" id="settings-toggle-btn">
        <span>Settings</span>
        <span class="arrow-icon" id="settings-arrow">▸</span>
      </button>
      <div class="settings-content" id="settings-content" style="display: none;">
        <div class="settings-group">
          <div class="section-label">Model</div>
          <div class="config-group">
            <div class="config-row">
              <label>ollama model</label>
              <input id="cfg-model" type="text" placeholder="gemma4:e2b">
            </div>
            <div class="config-row">
              <label>groq model</label>
              <input id="cfg-groq-model" type="text" placeholder="llama-3.1-8b-instant">
            </div>
          </div>
        </div>

        <div class="settings-group">
          <div class="section-label">Search</div>
          <div class="config-group">
            <div class="range-row">
              <label>max searches/turn <span id="max-searches-val">5</span></label>
              <input id="cfg-max-searches" type="range" min="1" max="10" value="5">
            </div>
          </div>
        </div>

        <div class="settings-group">
          <div class="section-label">System Prompt</div>
          <div class="config-row">
            <textarea id="cfg-system-prompt"
              rows="4">You are a helpful assistant with access to web search tools. Use web_search to look up current information when needed. Always cite your sources.</textarea>
          </div>
        </div>

        <div class="settings-group">
          <div class="section-label">Theme</div>
          <div class="theme-select-wrap">
            <select id="theme-select" class="theme-select">
              <option value="default">Terminal</option>
              <option value="light">Paper</option>
              <option value="solarized">Solarized</option>
              <option value="rose">Rose Pine</option>
              <option value="nord">Nord</option>
              <option value="gruvbox">Gruvbox</option>
              <option value="dracula">Dracula</option>
              <option value="monokai">Monokai</option>
              <option value="oceanic">Oceanic</option>
              <option value="Nebula">Nebula</option>
              <option value="lumina">Lumina</option>
              <option value="aurora">Aurora</option>
            </select>
          </div>
        </div>

        <div class="settings-group">
          <div class="section-label">Font</div>
          <div class="font-select-wrap">
            <select id="font-select" class="font-select">
              <option value="dm">DM Sans</option>
              <option value="inter">Inter</option>
              <option value="nunito">Nunito</option>
              <option value="outfit">Outfit</option>
              <option value="jakarta">Plus Jakarta Sans</option>
            </select>
          </div>
        </div>

        <!-- <button class="btn btn-apply">apply config</button> -->
        <button class="btn btn-clear">clear all chats</button>
      </div>
    </div>

    <div class="status-dot">
      <div class="dot" id="status-dot"></div>
      <span id="status-text">connecting...</span>
    </div>
    <div class="status-dot" id="embedding-status"
      style="display:none; margin-top: 8px; border-top: none; padding-top: 0;">
      <div class="dot orange"></div>
      <span style="color: var(--warn)">Regenerating embeddings...</span>
    </div>
  </aside>

  <main>
    <button class="menu-toggle">☰</button>
    <button id="memory-btn" class="memory-btn" title="View agent memory">
      <span class="icon">🧠</span>
      <span class="label">Memory</span>
    </button>
    <div id="messages"></div>

    <div class="input-area">
      <div class="input-wrap">
        <textarea id="user-input" placeholder="ask something..." rows="1"></textarea>
        <div class="input-controls">
          <div class="custom-select" id="model-select-wrapper">
            <div class="select-trigger" id="model-select-trigger">Default Mode</div>
            <div class="select-options" id="model-select-options">
              <div class="select-option" data-value="default">Default Mode</div>
              <div class="select-option" data-value="coding">Coding Mode</div>
              <div class="select-option" data-value="thinking">Thinking Mode</div>
            </div>
            <input type="hidden" id="model-selector" value="default">
          </div>
          <button id="voice-btn" class="voice-btn" title="click to record, stops on silence">🎤 voice</button>
          <button id="send-btn">send</button>
        </div>
      </div>
      <div class="hint">enter to send · shift+enter for newline · 🎤 auto-stops on silence</div>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <div id="memory-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Agent Memory</h2>
        <button id="close-memory-modal" class="close-modal">&times;</button>
      </div>
      <div class="modal-body">
        <div id="memory-slots">
          <!-- Slots rendered here -->
        </div>
      </div>
    </div>
  </div>

  <div id="edit-panel" class="edit-panel">
    <div id="edit-resizer" class="edit-resizer"></div>
    <div class="edit-header">
      <h2><span id="edit-badge" class="badge"></span> <span id="edit-path"></span></h2>
      <button class="close-edit-panel" id="close-edit-panel">&times;</button>
    </div>
    <div class="edit-content">
      <div class="diff-view">
        <div class="diff-pane">
          <div class="diff-pane-header">Original</div>
          <div class="diff-code" id="diff-old"></div>
        </div>
        <div class="diff-pane">
          <div class="diff-pane-header">Proposed</div>
          <div class="diff-code" id="diff-new"></div>
        </div>
      </div>
      <div class="diff-controls">
        <div class="summary" id="edit-summary"></div>
        <div class="diff-actions">
          <button class="btn-approve" id="btn-approve">Approve</button>
          <input type="text" id="reject-reason" placeholder="Reason for rejection (optional)">
          <button class="btn-reject" id="btn-reject">Reject</button>
        </div>
      </div>
      <div class="edit-history">
        <div class="edit-history-header">Edit History</div>
        <div class="edit-history-list" id="edit-history-list"></div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsdiff/7.0.0/diff.min.js"></script>
  <script type="module" src="/static/js/main.js"></script>
</body>

</html>
