<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>localAssist</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>

<body>
  <!-- Hover-reveal panel toolbar. A thin invisible zone pinned to the top of
       the panel; hovering it (or the toolbar) slides the toolbar down. Moving
       away slides it back out of sight, so no chrome persists over the app.
       Add future actions as more .toolbar-btn children. -->
  <div id="toolbar-zone" class="toolbar-zone hidden">
    <!-- Subtle affordance shown when the toolbar is hidden; hints you can
         hover here to reveal it. Fades out once the toolbar slides down. -->
    <div class="toolbar-hint" aria-hidden="true"></div>
    <div id="panel-toolbar" class="panel-toolbar">
      <button
        id="screenshot-btn"
        class="toolbar-btn"
        type="button"
        title="Screenshot the current page and attach it"
        aria-label="Screenshot the current page and attach it"
      >📷</button>
    </div>
  </div>

  <!-- Assistant UI, loaded from the local server -->
  <iframe
    id="assistant-frame"
    title="localAssist"
    allow="microphone; clipboard-read; clipboard-write"
  ></iframe>

  <!-- Fallback shown when the server can't be reached -->
  <div id="offline" class="offline hidden">
    <div class="offline-card">
      <div class="offline-logo">local<span>assist</span></div>
      <p class="offline-msg">Can't reach your assistant.</p>
      <p class="offline-sub">
        Make sure the server is running, then retry:
      </p>
      <pre class="offline-cmd">python server.py</pre>
      <div class="offline-row">
        <input id="server-url" type="text" spellcheck="false" />
        <button id="retry-btn">Retry</button>
      </div>
      <p class="offline-hint" id="offline-hint"></p>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>

</html>
